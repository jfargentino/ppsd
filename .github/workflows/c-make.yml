name: C make CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install System Dependencies
      run: sudo apt install libgps-dev pps-tools
    - name: Make build directory
      run: mkdir build
    - name: make
      run: make
    - name: make check
      run: make check
